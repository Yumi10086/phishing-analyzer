# 邮件认证/头部特征规则（作用域: mail）
- id: header_reply_mismatch
  name: Reply-To 域名不一致
  category: header
  points: 3
  reason: "Reply-To 域名与发件人域名不一致: {reply_to.domain}"
  match:
    field: auth.reply_to_aligned
    operator: equals_any
    values: [false]

- id: header_return_path_mismatch
  name: Return-Path 域名不一致
  category: header
  points: 6
  reason: "Return-Path 域名与发件人域名不一致: {return_path.domain}"
  match:
    field: auth.return_path_aligned
    operator: equals_any
    values: [false]

- id: header_missing_auth
  name: 缺少认证结果头
  category: header
  points: 2
  reason: "邮件缺少 Authentication-Results 头（非正规投递渠道）"
  match:
    field: auth.has_auth_header
    operator: equals_any
    values: [false]

# DMARC 的 pass 只能来自 SPF 或 DKIM 至少一项对齐通过。同一条认证头里 spf/dkim
# 都明确给出结果且都非 pass，却声明 dmarc=pass，合规接收方不会这样写——属伪造/
# 篡改认证头。只在单条头内部判定，跨头合并（不同 authserv-id 各覆盖部分方法）不触发。
- id: header_auth_inconsistent
  name: 认证头自相矛盾
  category: header
  points: 6
  reason: "Authentication-Results 自相矛盾：DMARC 声明 pass 但同头内 SPF/DKIM 均未 pass（伪造认证头特征）"
  match:
    field: auth.dmarc_without_mechanism
    operator: equals_any
    values: [true]

# 独立信号叠加（朴素贝叶斯思想：多个弱信号联合即强证据）
# 分值由探测器按已触发信号数动态给出（3项+4 / 4项+8 / 5项+12）
- id: signal_stack
  name: 信号叠加
  category: header
  kind: detector
  detector: signal_stack
  points: 12
  reason: "独立风险信号叠加（共 {value} 项）"

# ===== 营销/批量发送特征（类别标签层，信息性）=====
# 这些头部单独存在都可伪造，只作 1 分信息性信号；组合 >=2 项时由类别判定
# （app/scoring/category.py）标记为 marketing 供分流展示，不影响三档结论。
- id: header_list_unsubscribe
  name: 退订头部
  category: header
  points: 1
  reason: "携带 List-Unsubscribe 头（营销/批量邮件标配，可伪造）"
  match:
    field: has_list_unsubscribe
    operator: exists
    values: [true]

- id: header_precedence_bulk
  name: 批量投递标识
  category: header
  points: 1
  reason: "Precedence 声明 bulk/junk/list（批量投递标识）"
  match:
    field: precedence_bulk
    operator: exists
    values: [true]

# 群发垃圾软件的随机伪词 X-Mailer（如 "Axbkgg Ccerhjm 85.26"）。
# datacon 抽样 16% 命中，modern ham/spam 各 600 封 0 命中；自研Mailer会误中但
# 仅 4 分弱信号，不参与定性（判定逻辑见 features.is_junk_xmailer）。
- id: xmailer_random_junk
  name: 随机串 X-Mailer
  category: header
  points: 4
  reason: "X-Mailer 为随机伪词（群发垃圾软件特征）"
  match:
    field: xmailer_junk
    operator: exists
    values: [true]

# ===== 信封发件域核对（2026-09，报告 36fab11b15c6472a 归因）=====
# Authentication-Results 的 smtp.mail（SPF 实际校验的信封发件人）与 From 域不一致
# 且 SPF 未通过时是典型伪造特征（信封 iteview.com 发信冒充阿里云）。ESP 正规代发
# （信封=ESP 域且 SPF pass）被 SPF 条件排除，不误伤；null sender（<>退信）不匹配。
- id: auth_smtp_mail_mismatch
  name: 信封发件域与 From 不一致
  category: header
  points: 6
  reason: "信封发件域 {smtp_mail_domain} 与 From 域不一致且 SPF 未通过（伪造特征）"
  match:
    - field: smtp_mail_mismatch
      operator: exists
      values: [true]
    - field: auth.spf
      operator: equals_any
      values: [none, fail, softfail]
