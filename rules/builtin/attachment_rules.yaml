# ===== 无点媒体命名（2026-09，报告 8f7a759ca71d4575）=====
# 真实样本附件名 iU252Bjpg：主名与扩展名之间**没有点**——Windows 资源管理器不认
# 扩展名、杀软按内容识别，而收件人看到 iU252Bjpg 会以为是图片文件。extension 解析
# 为空导致全部扩展名档位规则落空，本规则补这个盲区。要求"无点 + 以已知媒体/
# 文档后缀结尾 + 主名含数字混合大小写"三条件，普通 README/Makefile 类无点文件不命中。
- id: att_name_no_ext_media
  name: 无点媒体后缀命名
  category: attachment
  scope: attachment
  points: 6
  reason: "附件名无扩展名分隔点但以媒体/文档后缀结尾（{stem}），刻意隐藏类型: {filename}"
  match:
    - field: extension
      operator: equals_any
      values: [""]
    - field: filename_lower
      operator: regex_any
      values: ['[a-z0-9]+[0-9][a-z0-9]*(jpg|jpeg|png|gif|bmp|webp|pdf|docx?|xlsx?|exe|scr)']


# ===== P2 YARA 家族检测（2026-09 接入评分引擎）=====
# 规则集 app/rules/phishing.yar（凭证模板/HTML 登录页/宏文档/URL 混淆），
# 由 app/rules/loader.py 扫描附件字节；yara-python 未安装时静默降级。
- id: att_yara_hit
  name: YARA 规则命中
  category: attachment
  scope: attachment
  points: 12
  reason: "附件命中 YARA 规则: {yara_rules}"
  match:
    field: yara_hit
    operator: exists
    values: [true]
