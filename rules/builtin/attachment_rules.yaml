# 附件特征规则（作用域: attachment，逐附件迭代）
- id: att_double_ext
  name: 双扩展名伪装
  category: attachment
  scope: attachment
  points: 10
  reason: "附件疑似双扩展名伪装: {filename}"
  match:
    # 判定在特征层（has_double_extension）：序列化/语义判定不适合写在 YAML 里。
    # 原实现是正则 '\..+\.'（"文件名里有两个点"），真实语料上误报严重——QQ 附件
    # 重命名产物 D531AA5F@ED440C33.898B3D67.jpg、中文常见命名"简历.最终版.pdf"
    # 都会中招，而它们与伪装无关。
    field: double_ext
    operator: exists
    values: [true]

# ===== 危险扩展名三级清单（2026-09 整合）=====
# 整合原 att_executable(10) / att_macro(8) / att_iso(6)：扩展名清单外置到
# rules/dicts/ext_{high,medium,low}_risk.txt，运维可直接增删词条；
# 分值自基线小步调整（10/8/6 → 12/8/3），未套用外部建议的 25/15/5。
- id: att_ext_high_risk
  name: 高危可执行附件
  category: attachment
  scope: attachment
  points: 12
  reason: "附件为高危可执行/镜像类型（.{extension}）: {filename}"
  match:
    field: extension
    operator: equals_any
    values: ["@dict:ext_high_risk"]

- id: att_ext_medium_risk
  name: 脚本或宏文档附件
  category: attachment
  scope: attachment
  points: 8
  reason: "附件为脚本/宏启用文档（.{extension}）: {filename}"
  match:
    field: extension
    operator: equals_any
    values: ["@dict:ext_medium_risk"]

# 压缩包本身无害（正常业务邮件常见），价值在"可藏载荷+可加密绕过网关"，
# 故只作 3 分弱信号，等 P1 压缩包递归看内层内容再升级判定。
- id: att_ext_low_risk
  name: 压缩归档附件
  category: attachment
  scope: attachment
  points: 3
  reason: "附件为压缩/归档容器（.{extension}）: {filename}"
  match:
    field: extension
    operator: equals_any
    values: ["@dict:ext_low_risk"]

- id: att_html
  name: HTML 附件
  category: attachment
  scope: attachment
  points: 4
  reason: "附件为 HTML（常见钓鱼登录页投递方式）: {filename}"
  match:
    field: extension
    operator: equals_any
    values: [html, htm]

- id: att_random_name
  name: 随机文件名
  category: attachment
  scope: attachment
  kind: detector
  detector: att_random_name
  points: 5
  reason: "附件文件名疑似随机生成（常见恶意载荷命名）: {value}"

# ===== P0 附件深度分析：真实类型三重核对与文件名欺骗（2026-09）=====
# 现有 att_executable/att_macro 等只看扩展名（"诚实的 exe" 也计分），这里补的是
# 「扩展名/声明 MIME 与真实内容是否一致」。发现只走启发式维度，单维度不过线原则
# 不变：内容信号最多推到 SUSPICIOUS，情报命中才 MALICIOUS 自动处置。

- id: att_type_mismatch
  name: 扩展名与真实类型不符
  category: attachment
  scope: attachment
  points: 12
  reason: "附件扩展名 .{extension} 与真实内容类型 {real_type} 不符（伪装）: {filename}"
  match:
    field: type_mismatch
    operator: exists
    values: [true]

- id: att_mime_type_conflict
  name: 声明 MIME 与真实内容冲突
  category: attachment
  scope: attachment
  points: 10
  reason: "附件声明 MIME 为 {content_type} 但真实内容为 {real_type}: {filename}"
  match:
    field: mime_type_conflict
    operator: exists
    values: [true]

- id: att_generic_mime
  name: 通用 MIME 夹带具体类型
  category: attachment
  scope: attachment
  points: 3
  reason: "附件用通用 MIME application/octet-stream 夹带 .{extension}（掩盖真实类型）: {filename}"
  match:
    field: generic_mime_known_ext
    operator: exists
    values: [true]

- id: att_filename_bidi
  name: 文件名双向控制字符
  category: attachment
  scope: attachment
  points: 10
  reason: "附件名含双向文本控制字符（RTL 反转伪装扩展名）: {filename}"
  match:
    field: has_bidi_control
    operator: exists
    values: [true]

- id: att_filename_overlong
  name: 附件名超长
  category: attachment
  scope: attachment
  points: 3
  reason: "附件名长度 {filename_length} 超长（隐藏真实扩展名）: {filename}"
  match:
    field: filename_length
    operator: gt
    values: [200]

- id: att_filename_space_padding
  name: 附件名空格填充
  category: attachment
  scope: attachment
  points: 3
  reason: "附件名含连续空格填充（{max_space_run} 个，扩展名伪装手法）: {filename}"
  match:
    field: max_space_run
    operator: gt
    values: [2]

# ===== P1 压缩包递归分析（2026-09）=====
# 结论由 app/attachment/archive.py 产出（pipeline 解析后写入 attachments[i]["archive"]）：
# 加密标志、内层可执行/宏文档、嵌套深度、zip 炸弹防护。非归档附件无这些字段，
# 全部按 False 兜底，不产生任何计分。
- id: att_archive_password_in_body
  name: 加密压缩包且正文含密码
  category: attachment
  scope: attachment
  points: 12
  reason: "加密压缩包且解压密码写在正文中（绕过网关的标准玩法）: {filename}"
  match:
    field: archive_password_in_body
    operator: exists
    values: [true]

- id: att_archive_inner_executable
  name: 压缩包内含可执行文件
  category: attachment
  scope: attachment
  points: 10
  reason: "压缩包内层含可执行/脚本文件（载荷投递）: {filename}"
  match:
    field: archive_has_executable
    operator: exists
    values: [true]

- id: att_archive_encrypted
  name: 加密压缩包
  category: attachment
  scope: attachment
  points: 8
  reason: "附件为加密压缩包（可能用于绕过网关检测）: {filename}"
  match:
    field: archive_encrypted
    operator: exists
    values: [true]

- id: att_archive_inner_macro
  name: 压缩包内含宏文档
  category: attachment
  scope: attachment
  points: 6
  reason: "压缩包内层含宏启用文档: {filename}"
  match:
    field: archive_has_macro
    operator: exists
    values: [true]

- id: att_archive_nested
  name: 嵌套压缩包
  category: attachment
  scope: attachment
  points: 3
  reason: "附件为嵌套压缩包（多层包裹规避检测）: {filename}"
  match:
    field: archive_nested_depth
    operator: gt
    values: [0]

