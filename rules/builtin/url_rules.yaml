# URL 特征规则（作用域: url，逐条 URL 迭代，任一命中即触发）
- id: url_ip_literal
  name: URL IP 直连
  category: url
  scope: url
  points: 8
  reason: "URL 使用 IP 直连而非域名: {url}"
  match:
    field: url
    operator: regex_any
    values: ['^[a-z]+://\d{1,3}(\.\d{1,3}){3}']

- id: url_suspicious_tld
  name: 高风险顶级域名
  category: url
  scope: url
  points: 5
  reason: "URL 使用高风险顶级域名: {url}"
  match:
    field: host
    operator: suffix_any
    values: ["@dict:suspicious_tlds"]

- id: url_punycode
  name: Punycode 域名
  category: url
  scope: url
  points: 8
  reason: "URL 含 Punycode 域名（可能的同形字伪造）: {url}"
  match:
    field: url
    operator: contains_any
    values: ["xn--"]

- id: url_shortener
  name: 短链接服务
  category: url
  scope: url
  points: 5
  reason: "URL 使用短链接服务: {url}"
  match:
    field: host
    operator: suffix_any
    values: ["@dict:shorteners"]

- id: url_at_sign
  name: URL @ 符号混淆
  category: url
  scope: url
  points: 6
  reason: "URL 中包含 @ 符号（混淆真实主机）: {url}"
  match:
    field: url
    operator: regex_any
    values: ['^[a-z]+://[^/]*@']

- id: url_many_subdomains
  name: 子域名层级异常
  category: url
  scope: url
  points: 4
  reason: "URL 子域名层级异常（>=4）: {url}"
  match:
    field: label_count
    operator: gt
    values: [3]

- id: url_keywords
  name: URL 凭证关键词
  category: url
  scope: url
  points: 5
  reason: "URL 包含凭证/验证相关关键词: {url}"
  match:
    field: url
    operator: contains_any
    # 只认**凭证本体**词，不认 account/login/verify/secure/update/confirm/billing/
    # invoice 这类通用商务词——正常账号页与营销追踪链接天然含它们（accountSummary、
    # wp-login.php、home/verify/email、AccountRecoveryCode…）。2026-09 规则语义审查：
    # 该规则在真实邮箱上命中率 51.4%、留一法"省误报 47 / 丢召回 1"，但按基础比率折算，
    # 命中里只有 0.02% 是钓鱼（提升度 0.2，**与钓鱼负相关**）；收窄后邮箱命中 235→16。
    # 字典 url_keywords.txt 保持不变：body_credentials 仍需要其中的通用词。
    values: ["password", "wallet", "recover", "unlock", "密码", "重置"]
