# 链接域与发件域关系规则（作用域: mail，字段由 build_features 计算）
#
# 背景：邮件正文里的链接域名与发件域名本该属同一主体。钓鱼邮件有两种典型偏离：
#   1. 仿冒配对——链接域是发件域的"标签内前后缀注入"
#      （发件 bizsupport.co，链接 support.co；或反向），同一主体不会这样互链；
#   2. 无关域名——链接跳到与发件方完全无关的域名。
# 注意：
#   - 可注册域相同不算不一致（mail.example.com 与 example.com 同属 example.com），
#     因此常规"子域 -> 主域"跳转不会触发；
#   - 短链与已知合法第三方服务域见 rules/dicts/link_allowlist.txt，由白名单排除，
#     否则正常营销邮件（社交/ESP/CDN 链接）会大量误报；
#   - 两条规则互斥（仿冒配对不再按"无关域名"重复计分）。

- id: link_domain_lookalike
  name: 链接域仿冒发件域
  category: link
  scope: mail
  points: 10
  reason: "链接域名与发件域名构成仿冒配对: {value}"
  match:
    field: link_domain_lookalike
    operator: exists
    values: [true]

- id: link_domain_mismatch
  name: 链接域与发件域无关
  category: link
  scope: mail
  points: 4
  reason: "链接域名与发件域名不一致: {value}"
  match:
    field: link_domain_mismatch
    operator: exists
    values: [true]

# 用户内容托管平台上的点击目标（2026-09）。与 link_domain_mismatch 的分工：
# 后者是"链接域与发件域无关"（4 分，弱），本规则进一步指出**这个域是任何人都能发布内容的
# 免费建站/对象存储/网盘**（子域或桶名）——正常公司的点击目标极少落在"陌生人可自由创建的
# 站点"上。实测三语料：邮箱 625 封正常 0.8%、pot 500 封钓鱼 2.6%、datacon 0%；其中 5 封
# pot 钓鱼当前判 BENIGN（heuristic 6~13），正是本规则要补的那段召回。
# 刻意不含 SaaS 客户子域（`ollama.typeform.com` 是正常厂商表单）、短链（另有 url_shortener）
# 与社区论坛；`<img src>` 等资源引用不算（CDN 上的图片是正常形态）。
- id: link_user_content_hosting
  name: 链接托管在用户内容平台
  category: link
  scope: mail
  points: 6
  reason: "点击目标托管在用户内容平台（任何人都能发布内容）: {value}"
  match:
    field: user_content_link
    operator: exists
    values: [true]
